[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pomodoro"
version = "0.1.0"
description = "A starter Python project with linting, formatting and tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff~=0.17.0",
    "pytest>=8",
]

[project.scripts]
pomodoro = "pomodoro.main:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: modernise syntax for your Python version
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
